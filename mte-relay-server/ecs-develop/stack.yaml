AWSTemplateFormatVersion: "2010-09-09"
Description: "CloudFormation template for running MTE Relay on ECS, ALB, and ElastiCache"

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC where resources will be deployed

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: List of subnets for the ECS tasks and ALB

  ContainerImage:
    Type: String
    Default: 709825985650.dkr.ecr.us-east-1.amazonaws.com/eclypses/mte-relay-server:4.6.7
    Description: Docker image URI

  Upstream:
    Type: String
    Description: URL of the upstream server
    Default: ""

  CorsOrigins:
    Type: String
    Description: Comma-separated list of allowed CORS origins
    Default: ""

  ClientIdSecret:
    Type: String
    Description: A ClientID Secret
    Default: ""
    NoEcho: true
    AllowedPattern: "^$|^.{32,}$"
    ConstraintDescription: must be empty (auto-generate) or at least 32 characters

  DomainMap:
    Type: String
    Description: Domain mapping configuration
    Default: ""

  CorsMethods:
    Type: String
    Description: Comma-separated list of allowed CORS methods (empty uses the application default)
    Default: ""

  PassThroughRoutes:
    Type: String
    Description: Comma-separated list of regex route patterns that bypass MTE processing
    Default: ""

  LogLevel:
    Type: String
    Description: Application log level
    Default: debug
    AllowedValues:
      - trace
      - debug
      - info
      - warn
      - error
      - fatal
      - panic
      - disabled

  PoolSize:
    Type: Number
    Description: MTE encoder/decoder pool size
    Default: 600

Resources:
  # Security Groups
  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription:
        !Join ["", [!Ref AWS::StackName, " Security group for ECS tasks"]]
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref ALBSecurityGroup
      Tags:
        - Key: Name
          Value: !Join ["", [!Ref AWS::StackName, "-ecs-sg"]]

  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription:
        !Join ["", [!Ref AWS::StackName, " Security group for ALB"]]
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Join ["", [!Ref AWS::StackName, "-alb-sg"]]

  ElastiCacheSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription:
        !Join ["", [!Ref AWS::StackName, " Security group for ElastiCache"]]
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId: !Ref ECSSecurityGroup
      Tags:
        - Key: Name
          Value: !Join ["", [!Ref AWS::StackName, "-elasticache-sg"]]

  # ECS Cluster
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Join ["", [!Ref AWS::StackName, "-ECS-Cluster"]]

  # ECS Task Definition
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Join ["", [!Ref AWS::StackName, "-mte-relay-task"]]
      Cpu: "1024"
      Memory: "2048"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      ContainerDefinitions:
        - Name: !Join ["", [!Ref AWS::StackName, "-container"]]
          Image: !Ref ContainerImage
          Essential: true
          Environment:
            - Name: DOMAIN_MAP
              Value: !Ref DomainMap
            - Name: UPSTREAM
              Value: !Ref Upstream
            - Name: LOG_LEVEL
              Value: !Ref LogLevel
            - Name: CORS_ORIGINS
              Value: !Ref CorsOrigins
            - Name: CORS_METHODS
              Value: !Ref CorsMethods
            - Name: CLIENT_ID_SECRET
              Value: !Ref ClientIdSecret
            - Name: PASS_THROUGH_ROUTES
              Value: !Ref PassThroughRoutes
            - Name: POOL_SIZE
              Value: !Ref PoolSize
            - Name: AWS_REGION
              Value: !Ref "AWS::Region"
            - Name: REDIS_URL
              Value: !Join
                - ""
                - - "rediss://"
                  - !GetAtt ElastiCacheRedis.PrimaryEndPoint.Address
                  - ":"
                  - !GetAtt ElastiCacheRedis.PrimaryEndPoint.Port
          PortMappings:
            - ContainerPort: 8080
              HostPort: 8080
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref CloudWatchLogsGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: !Ref AWS::StackName

  # CloudWatch Logs Group
  CloudWatchLogsGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Join ["", ["/ecs/", !Ref AWS::StackName, "-mte-relay-app"]]
      RetentionInDays: 14

  # ECS Service
  ECSService:
    Type: AWS::ECS::Service
    DependsOn: ALB
    Properties:
      ServiceName: !Join ["", [!Ref AWS::StackName, "-mte-relay-service"]]
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref ECSSecurityGroup
          Subnets: !Ref SubnetIds
      LoadBalancers:
        - ContainerName: !Join ["", [!Ref AWS::StackName, "-container"]]
          ContainerPort: 8080
          TargetGroupArn: !Ref ALBTargetGroup

  # Application Load Balancer
  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Join ["", [!Ref AWS::StackName, "-alb"]]
      Scheme: internet-facing
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: "60"
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Subnets: !Ref SubnetIds
      Tags:
        - Key: Name
          Value: !Join ["", [!Ref AWS::StackName, "-alb"]]

  # ALB Target Group
  ALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Join ["", [!Ref AWS::StackName, "-tg"]]
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VpcId
      HealthCheckPath: /api/mte-echo
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      Tags:
        - Key: Name
          Value: !Join ["", [!Ref AWS::StackName, "-target-group"]]

  # HTTP Listener
  ALBListenerHTTP:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP

  # ElastiCache Redis
  ElastiCacheSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description:
        !Join ["", [!Ref AWS::StackName, " Subnet group for ElastiCache"]]
      SubnetIds: !Ref SubnetIds
      CacheSubnetGroupName:
        !Join ["-", [!Ref AWS::StackName, "cache-subnet-group"]]

  ElastiCacheRedis:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupId: !Join ["", [!Ref AWS::StackName, "-redis"]]
      ReplicationGroupDescription:
        !Join [
          "",
          [!Ref AWS::StackName, " Redis replication group with TLS enabled"],
        ]
      Engine: redis
      CacheNodeType: cache.t3.micro
      NumCacheClusters: 1
      AutomaticFailoverEnabled: false
      TransitEncryptionEnabled: true
      SecurityGroupIds:
        - !Ref ElastiCacheSecurityGroup
      CacheSubnetGroupName: !Ref ElastiCacheSubnetGroup

  # IAM Roles - Removed explicit RoleName properties
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Tags:
        - Key: Name
          Value: !Join ["", [!Ref AWS::StackName, "-ECSTaskExecutionRole"]]

  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: MarketplaceRegisterUsage
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: aws-marketplace:RegisterUsage
                Resource: "*"
      Tags:
        - Key: Name
          Value: !Join ["", [!Ref AWS::StackName, "-ECSTaskRole"]]

Outputs:
  ALBDNSName:
    Description: DNS name of the load balancer
    Value: !GetAtt ALB.DNSName
